<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Shop - E-commerce Order Management</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="/static/css/style.css" rel="stylesheet">
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
      <a class="navbar-brand" href="index.html">E-Shop</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav me-auto">
          <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
          <li class="nav-item"><a class="nav-link" href="cart.html">Cart</a></li>
          <li class="nav-item"><a class="nav-link" href="orders.html">My Orders</a></li>
        </ul>
        <ul class="navbar-nav" id="auth-nav"></ul>
      </div>
    </div>
  </nav>

  <div class="container mt-4">
    <h2 class="mb-3">Products</h2>
    <form id="search-form" class="input-group mb-4">
      <input type="search" id="search-input" class="form-control" placeholder="Search products (e.g. something for running)">
      <button class="btn btn-outline-primary" type="submit">Search</button>
      <button class="btn btn-outline-secondary" type="button" id="search-clear">Clear</button>
    </form>
    <div id="alert-container"></div>
    <div id="products-container" class="row g-4"></div>
    <div class="text-center my-4">
      <button id="load-more" class="btn btn-outline-primary d-none" type="button">Load more</button>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/static/js/api.js"></script>
  <script>
    const PAGE_SIZE = 8;
    let skip = 0;

    function bindAddToCart() {
      document.querySelectorAll(".add-to-cart-btn:not([data-bound])").forEach((btn) => {
        btn.dataset.bound = "1";
        btn.addEventListener("click", () => addToCart(btn.dataset.productId));
      });
    }

    // Loads the normal list (append=true fetches the next page) or search results.
    async function loadProducts(query, append = false) {
      const container = document.getElementById("products-container");
      const moreBtn = document.getElementById("load-more");
      moreBtn.classList.add("d-none");
      if (!append) skip = 0;
      try {
        const path = query
          ? `/products/search?q=${encodeURIComponent(query)}&limit=5`
          : `/products?skip=${skip}&limit=${PAGE_SIZE}`;
        const products = await apiFetch(path);
        if (!append && !products.length) {
          container.innerHTML = `<p class="text-muted">${query ? "No matching products" : "No products available."}</p>`;
          return;
        }
        const html = products.map(renderProductCard).join("");
        if (append) container.insertAdjacentHTML("beforeend", html);
        else container.innerHTML = html;
        bindAddToCart();

        if (!query) {
          skip += products.length;
          if (products.length >= PAGE_SIZE) moreBtn.classList.remove("d-none");
        }
      } catch (err) {
        if (!append) container.innerHTML = "";
        showAlert("alert-container", `${query ? "Search failed" : "Failed to load products"}: ${err.message}`);
      }
    }

    function renderProductCard(product) {
      return `
        <div class="col-sm-6 col-md-4 col-lg-3">
          <div class="card product-card shadow-sm">
            <div class="card-body d-flex flex-column">
              <span class="badge bg-secondary category-badge align-self-start mb-2">${product.category}</span>
              <h5 class="card-title">${product.name}</h5>
              <p class="card-text text-muted flex-grow-1">${product.description || ""}</p>
              <p class="price mb-2">$${product.price.toFixed(2)}</p>
              <p class="small text-muted mb-2">${product.stock > 0 ? `${product.stock} in stock` : "Out of stock"}</p>
              <button class="btn btn-primary add-to-cart-btn mt-auto" data-product-id="${product.id}" ${product.stock === 0 ? "disabled" : ""}>
                Add to Cart
              </button>
            </div>
          </div>
        </div>
      `;
    }

    async function addToCart(productId) {
      if (!isLoggedIn()) {
        window.location.href = "login.html";
        return;
      }
      try {
        await apiFetch("/cart", {
          method: "POST",
          body: JSON.stringify({ product_id: productId, quantity: 1 }),
        });
        showAlert("alert-container", "Added to cart!", "success");
      } catch (err) {
        showAlert("alert-container", `Failed to add to cart: ${err.message}`);
      }
    }

    document.getElementById("search-form").addEventListener("submit", (e) => {
      e.preventDefault();
      loadProducts(document.getElementById("search-input").value.trim());
    });
    document.getElementById("search-clear").addEventListener("click", () => {
      document.getElementById("search-input").value = "";
      loadProducts();
    });

    document.getElementById("load-more").addEventListener("click", () => loadProducts(undefined, true));

    loadProducts();
  </script>
</body>
</html>
