<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>My Orders - E-commerce Order Management</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="/static/css/style.css" rel="stylesheet">
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
      <a class="navbar-brand" href="index.html">E-Shop</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav me-auto">
          <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
          <li class="nav-item"><a class="nav-link" href="cart.html">Cart</a></li>
          <li class="nav-item"><a class="nav-link active" href="orders.html">My Orders</a></li>
        </ul>
        <ul class="navbar-nav" id="auth-nav"></ul>
      </div>
    </div>
  </nav>

  <div class="container mt-4">
    <h2 class="mb-4">My Orders</h2>
    <div id="alert-container"></div>

    <div id="orders-container">
      <p class="text-muted">Loading orders...</p>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/static/js/api.js"></script>
  <script>
    let productMap = {};

    async function loadProducts() {
      try {
        const products = await apiFetch("/products");
        productMap = Object.fromEntries(products.map((p) => [p.id, p.name]));
      } catch (err) {
        productMap = {};
      }
    }

    function statusBadgeClass(status) {
      switch (status) {
        case "pending": return "bg-warning text-dark";
        case "shipped": return "bg-info text-dark";
        case "delivered": return "bg-success";
        case "cancelled": return "bg-danger";
        default: return "bg-secondary";
      }
    }

    function renderOrders(orders) {
      const container = document.getElementById("orders-container");
      if (!orders.length) {
        container.innerHTML = `<p class="text-muted">You haven't placed any orders yet.</p>`;
        return;
      }

      container.innerHTML = orders.map((order) => `
        <div class="card mb-3" data-order-id="${order.id}">
          <div class="card-body">
            <div class="d-flex justify-content-between align-items-start mb-2">
              <div>
                <h5 class="card-title mb-1">Order placed on ${new Date(order.created_at).toLocaleString()} &mdash; Status: ${order.status}</h5>
              </div>
              <span class="badge ${statusBadgeClass(order.status)}">${order.status}</span>
            </div>
            <ul class="list-group list-group-flush mb-3">
              ${order.items.map((item) => `
                <li class="list-group-item d-flex justify-content-between">
                  <span>${productMap[item.product_id] || item.product_id}</span>
                  <span>Qty: ${item.quantity}</span>
                </li>
              `).join("")}
            </ul>
            <div class="d-flex justify-content-end">
              <strong>Total: $${order.total.toFixed(2)}</strong>
            </div>
          </div>
        </div>
      `).join("");
    }

    async function loadOrders() {
      if (!isLoggedIn()) {
        window.location.href = "login.html";
        return;
      }

      const container = document.getElementById("orders-container");
      try {
        await loadProducts();
        const orders = await apiFetch("/orders");
        renderOrders(orders);
      } catch (err) {
        container.innerHTML = "";
        showAlert("alert-container", `Failed to load orders: ${err.message}`);
      }
    }

    loadOrders();
  </script>
</body>
</html>
