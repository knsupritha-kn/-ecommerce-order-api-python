<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Cart - E-commerce Order Management</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="/static/css/style.css" rel="stylesheet">
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
      <a class="navbar-brand" href="index.html">E-Shop</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav me-auto">
          <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
          <li class="nav-item"><a class="nav-link" href="cart.html">Cart</a></li>
          <li class="nav-item"><a class="nav-link" href="orders.html">My Orders</a></li>
        </ul>
        <ul class="navbar-nav" id="auth-nav"></ul>
      </div>
    </div>
  </nav>

  <div class="container mt-4">
    <h2 class="mb-4">Your Cart</h2>
    <div id="alert-container"></div>

    <div id="cart-container">
      <table class="table bg-white align-middle">
        <thead>
          <tr>
            <th>Product</th>
            <th>Quantity</th>
            <th></th>
          </tr>
        </thead>
        <tbody id="cart-items"></tbody>
      </table>
      <div class="d-flex justify-content-end mb-4">
        <span class="cart-total">Total: $<span id="cart-total">0.00</span></span>
      </div>
    </div>

    <div class="card">
      <div class="card-body">
        <h5 class="card-title">Place Order</h5>
        <div class="mb-3">
          <label for="shipping-address" class="form-label">Shipping Address</label>
          <input type="text" class="form-control" id="shipping-address" placeholder="123 Main St, City, Country" required>
        </div>
        <button class="btn btn-success" id="place-order-btn">Place Order</button>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/static/js/api.js"></script>
  <script>
    let currentCart = null;
    let productMap = {};

    async function loadProducts() {
      try {
        const products = await apiFetch("/products");
        productMap = Object.fromEntries(products.map((p) => [p.id, p.name]));
      } catch (err) {
        productMap = {};
      }
    }

    async function loadCart() {
      if (!isLoggedIn()) {
        window.location.href = "login.html";
        return;
      }

      const tbody = document.getElementById("cart-items");
      try {
        await loadProducts();
        currentCart = await apiFetch("/cart");
        renderCart(currentCart);
      } catch (err) {
        currentCart = { items: [], total: 0 };
        tbody.innerHTML = `<tr><td colspan="3" class="text-muted">Your cart is empty.</td></tr>`;
        document.getElementById("cart-total").textContent = "0.00";
      }
    }

    function renderCart(cart) {
      const tbody = document.getElementById("cart-items");
      if (!cart.items.length) {
        tbody.innerHTML = `<tr><td colspan="3" class="text-muted">Your cart is empty.</td></tr>`;
      } else {
        tbody.innerHTML = cart.items.map((item) => `
          <tr>
            <td>${productMap[item.product_id] || item.product_id}</td>
            <td>${item.quantity}</td>
            <td>
              <button class="btn btn-sm btn-outline-danger remove-btn" data-product-id="${item.product_id}">Remove</button>
            </td>
          </tr>
        `).join("");

        document.querySelectorAll(".remove-btn").forEach((btn) => {
          btn.addEventListener("click", () => removeItem(btn.dataset.productId));
        });
      }
      document.getElementById("cart-total").textContent = cart.total.toFixed(2);
    }

    async function removeItem(productId) {
      try {
        currentCart = await apiFetch(`/cart/${productId}`, { method: "DELETE" });
        renderCart(currentCart);
      } catch (err) {
        showAlert("alert-container", `Failed to remove item: ${err.message}`);
      }
    }

    document.getElementById("place-order-btn").addEventListener("click", async () => {
      const shippingAddress = document.getElementById("shipping-address").value.trim();
      if (!shippingAddress) {
        showAlert("alert-container", "Please enter a shipping address.");
        return;
      }
      if (!currentCart || !currentCart.items.length) {
        showAlert("alert-container", "Your cart is empty.");
        return;
      }

      try {
        await apiFetch("/orders", {
          method: "POST",
          body: JSON.stringify({
            items: currentCart.items,
            shipping_address: shippingAddress,
          }),
        });
        showAlert("alert-container", "Order placed successfully!", "success");
        currentCart = { items: [], total: 0 };
        renderCart(currentCart);
        document.getElementById("shipping-address").value = "";
      } catch (err) {
        showAlert("alert-container", `Failed to place order: ${err.message}`);
      }
    });

    loadCart();
  </script>
</body>
</html>
